<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Student Academic Planner</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Poppins', sans-serif;
      background-color: #e9f1f7;
      margin: 0;
      padding: 0;
    }
    nav {
      background-color: #333;
      padding: 1rem;
    }
    nav a {
      color: white;
      margin: 0 1rem;
      text-decoration: none;
    }
    nav a:hover {
      text-decoration: underline;
    }
    section {
      padding: 2rem;
      display: none;
    }
    section.active {
      display: block;
    }
    .quote-box {
      background: #e6f7ff;
      border-left: 4px solid #1890ff;
      padding: 1rem;
      font-style: italic;
    }
    .btn {
      background-color: #1890ff;
      color: white;
      border: none;
      padding: 0.5rem 1rem;
      margin-top: 1rem;
      cursor: pointer;
      border-radius: 5px;
    }
    .btn:hover {
      background-color: #40a9ff;
    }
    #task-list li.completed {
      text-decoration: line-through;
      color: gray;
    }
    #calendar {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      gap: 5px;
      text-align: center;
    }
    #calendar div {
      padding: 10px;
      background: white;
      border: 1px solid #ccc;
      border-radius: 4px;
    }
    .calendar-nav {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 10px;
    }
    .subject-card {
      background: #ffffff;
      border-left: 5px solid #1890ff;
      margin-bottom: 10px;
      padding: 10px;
      border-radius: 4px;
      box-shadow: 1px 1px 3px rgba(0,0,0,0.1);
    }
    /* Study Timer Enhancements */
    #timer-display {
      font-size: 4rem;
      font-weight: bold;
      margin-bottom: 1rem;
      background-color: #ffffff;
      padding: 1rem;
      border-radius: 10px;
      box-shadow: 0 4px 6px rgba(0,0,0,0.1);
      width: 200px;
      text-align: center;
      color: #333;
    }
    #timer-controls {
      display: flex;
      gap: 1rem;
      justify-content: center;
    }
  </style>
</head>
<body>
  <nav>
    <a href="#home" onclick="showPage('home')">Home</a>
    <a href="#subjects" onclick="showPage('subjects')">Subjects</a>
    <a href="#todo" onclick="showPage('todo')">To-Do List</a>
    <a href="#calendarView" onclick="showPage('calendarView')">Calendar</a>
    <a href="#timer" onclick="showPage('timer')">Study Timer</a>
  </nav>

  <section id="home" class="active">
    <h1>Welcome to Your Academic Planner</h1>
    <div class="quote-box">
      <p id="quote">"The secret to getting ahead is getting started."</p>
      <p id="author">- Mark Twain</p>
    </div>
    <button class="btn" onclick="changeQuote()">New Quote</button>
  </section>

  <section id="subjects">
    <h2>Subjects</h2>
    <div id="subjects-list"></div>
  </section>

  <section id="todo">
    <h2>To-Do List</h2>
    <input type="text" id="task-input" placeholder="Enter a task">
    <button class="btn" onclick="addTask()">Add</button>
    <ul id="task-list"></ul>
  </section>

  <section id="calendarView">
    <h2>Calendar View</h2>
    <div class="calendar-nav">
      <button class="btn" onclick="prevMonth()">&#8592; Prev</button>
      <span id="calendar-month"></span>
      <button class="btn" onclick="nextMonth()">Next &#8594;</button>
    </div>
    <div id="calendar"></div>
  </section>

  <section id="timer">
    <h2>Pomodoro Timer</h2>
    <div style="display:flex;flex-direction:column;align-items:center">
      <div id="timer-display">25:00</div>
      <div id="timer-controls">
        <button class="btn" onclick="startTimer()">Start</button>
        <button class="btn" onclick="resetTimer()">Reset</button>
      </div>
    </div>
  </section>

  <script>
    const quotes = [
      { quote: "The future depends on what you do today.", author: "Mahatma Gandhi" },
      { quote: "Don't watch the clock; do what it does. Keep going.", author: "Sam Levenson" },
      { quote: "Push yourself, because no one else is going to do it for you.", author: "Anonymous" },
      { quote: "Success is the sum of small efforts, repeated day in and day out.", author: "Robert Collier" },
      { quote: "The expert in anything was once a beginner.", author: "Helen Hayes" }
    ];

    function changeQuote() {
      const randomIndex = Math.floor(Math.random() * quotes.length);
      document.getElementById("quote").textContent = `"${quotes[randomIndex].quote}"`;
      document.getElementById("author").textContent = `- ${quotes[randomIndex].author}`;
    }

    function showPage(id) {
      document.querySelectorAll('section').forEach(section => {
        section.classList.remove('active');
      });
      document.getElementById(id).classList.add('active');
    }

    const subjects = [
      { name: "Mathematics", grade: "A" },
      { name: "Physics", grade: "B+" },
      { name: "Chemistry", grade: "A-" }
    ];

    const subjectList = document.getElementById('subjects-list');
    subjects.forEach(subject => {
      const div = document.createElement('div');
      div.className = 'subject-card';
      div.innerHTML = `<strong>${subject.name}</strong> - Grade: ${subject.grade}`;
      subjectList.appendChild(div);
    });

    function addTask() {
      const input = document.getElementById('task-input');
      const taskText = input.value.trim();
      if (!taskText) return;
      const li = document.createElement('li');
      li.textContent = taskText;
      li.onclick = () => li.classList.toggle('completed');
      document.getElementById('task-list').appendChild(li);
      input.value = '';
    }

    let currentDate = new Date();
    const calendar = document.getElementById('calendar');
    const calendarMonth = document.getElementById('calendar-month');

    function renderCalendar() {
      calendar.innerHTML = '';
      const year = currentDate.getFullYear();
      const month = currentDate.getMonth();

      calendarMonth.textContent = `${currentDate.toLocaleString('default', { month: 'long' })} ${year}`;

      const daysOfWeek = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'];
      daysOfWeek.forEach(day => {
        const div = document.createElement('div');
        div.textContent = day;
        calendar.appendChild(div);
      });

      const firstDay = new Date(year, month, 1).getDay();
      const totalDays = new Date(year, month + 1, 0).getDate();

      for (let i = 0; i < firstDay; i++) {
        calendar.appendChild(document.createElement('div'));
      }
      for (let i = 1; i <= totalDays; i++) {
        const day = document.createElement('div');
        day.textContent = i;
        calendar.appendChild(day);
      }
    }

    function prevMonth() {
      currentDate.setMonth(currentDate.getMonth() - 1);
      renderCalendar();
    }

    function nextMonth() {
      currentDate.setMonth(currentDate.getMonth() + 1);
      renderCalendar();
    }

    let timer;
    let time = 25 * 60;
    function updateTimerDisplay() {
      const minutes = Math.floor(time / 60);
      const seconds = time % 60;
      document.getElementById('timer-display').textContent = `${String(minutes).padStart(2, '0')}:${String(seconds).padStart(2, '0')}`;
    }
    function startTimer() {
      if (timer) return;
      timer = setInterval(() => {
        if (time > 0) {
          time--;
          updateTimerDisplay();
        } else {
          clearInterval(timer);
          timer = null;
          alert('Time is up!');
        }
      }, 1000);
    }
    function resetTimer() {
      clearInterval(timer);
      timer = null;
      time = 25 * 60;
      updateTimerDisplay();
    }
    updateTimerDisplay();
    renderCalendar();
  </script>
</body>
</html>
